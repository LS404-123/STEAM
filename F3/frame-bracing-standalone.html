      &lt;input id=&quot;frame-force&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;-100&quot; max=&quot;100&quot; value=&quot;0&quot; step=&quot;1&quot;&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;frame-bracing&#x27;);
  const slider = root.querySelector(&#x27;#frame-force&#x27;);
  const output = root.querySelector(&#x27;#frame-force-value&#x27;);
  const panels = [...root.querySelectorAll(&#x27;section&#x27;)];
  // MODEL START
  // ponytail: 一個自由度的彈性示意模型；實際承重需另計接合、屈曲及材料性質。
  // 邊長 = 1；底邊固定；頂邊保持水平。微弱回正力讓無斜撐框架有靜態平衡。
  function restoring(x, count) {
    let force = x;
    for (let i = 0; i &lt; count; i++) {
      const sign = i === 0 ? 1 : -1;
      const length = Math.sqrt(2 + 2 * sign * x);
      force += 16 * (length - Math.SQRT2) * sign / length;
    }
    return force;
  }
  function displacement(force, count) {
    let lo = -0.75, hi = 0.75;
    for (let i = 0; i &lt; 60; i++) {
      const mid = (lo + hi) / 2;
      if (restoring(mid, count) &lt; force) lo = mid;
      else hi = mid;
    }
    return (lo + hi) / 2;
  }
  // MODEL END
  function draw() {
    const value = Number(slider.value);
    output.textContent = value === 0 ? &#x27;0&#x27; : `${value &gt; 0 ? &#x27;向右&#x27; : &#x27;向左&#x27;} ${Math.abs(value)}`;

    panels.forEach((panel, count) =&gt; {

      const w = panel.clientWidth;
      const side = Math.min(320, (w - 16) / 2.2);
      const x = displacement(value * 0.006, count);
      const baseY = side + 64;
      const left = (w - side) / 2;
      const topY = baseY - side * Math.sqrt(1 - x * x);
      const a = [left, baseY], b = [left + side, baseY];
      const c = [left + side + x * side, topY], d = [left + x * side, topY];
      const line = (p, q, attrs = &#x27;&#x27;) =&gt; `&lt;line x1=&quot;${p[0]}&quot; y1=&quot;${p[1]}&quot; x2=&quot;${q[0]}&quot; y2=&quot;${q[1]}&quot; ${attrs}/&gt;`;
      const brace = (p, q, sign) =&gt; {
        const loaded = Math.abs(x) &gt; 1e-8;
        const tension = sign * x &gt; 0;
        const color = !loaded ? &#x27;var(--muted-foreground)&#x27; : tension ? &#x27;var(--viz-series-1)&#x27; : &#x27;var(--viz-series-2)&#x27;;

      };
      const center = (c[0] + d[0]) / 2;
      const arrowEnd = center + value * 0.38;
      const arrowY = topY - 25;
      const dir = Math.sign(value);
      const arrow = value === 0 ? &#x27;&#x27; : line([center, arrowY], [arrowEnd, arrowY], &#x27;stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;&#x27;) + `&lt;path d=&quot;M ${arrowEnd-dir*7} ${arrowY-4} L ${arrowEnd} ${arrowY} L ${arrowEnd-dir*7} ${arrowY+4}&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot;/&gt;`;
      const status = count === 0 ? &#x27;接點轉動&#x27; : value === 0 ? &#x27;斜撐未受力&#x27; : count === 1 ? (x &gt; 0 ? &#x27;斜撐受拉&#x27; : &#x27;斜撐受壓&#x27;) : &#x27;一條受拉，一條受壓&#x27;;
      svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${w} ${baseY + 45}`);
      svg.innerHTML = `&lt;title&gt;${count} 條斜撐：${status}&lt;/title&gt;
        &lt;rect x=&quot;${left}&quot; y=&quot;${baseY-side}&quot; width=&quot;${side}&quot; height=&quot;${side}&quot; fill=&quot;none&quot; stroke=&quot;var(--border)&quot; stroke-width=&quot;2&quot; stroke-dasharray=&quot;3 4&quot;/&gt;
        ${count &gt; 0 ? brace(a, c, 1) : &#x27;&#x27;}${count &gt; 1 ? brace(b, d, -1) : &#x27;&#x27;}
        &lt;path d=&quot;M ${a} L ${b} L ${c} L ${d} Z&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linejoin=&quot;round&quot;/&gt;
        ${[a,b].map(p =&gt; `&lt;path d=&quot;M ${p[0]} ${p[1]+5} l -8 12 h 16 Z&quot; fill=&quot;var(--muted)&quot; stroke=&quot;currentColor&quot;/&gt;` + line([p[0]-12,p[1]+20],[p[0]+12,p[1]+20],&#x27;stroke=&quot;currentColor&quot;&#x27;)).join(&#x27;&#x27;)}
