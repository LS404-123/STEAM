<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="動手搭木橋測試承重，用互動模擬探索框架結構，跟著步驟認識 LED 矩陣接線。">
  <title>STEAM 實驗室</title>
  <style>
    :root { color-scheme:light; --paper:#f3f7f7; --ink:#16323b; --muted:#4f686e; --green:#12695c; --copper:#b44c32; --line:#cddadb; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif; line-height:1.65; }
    main { max-width:1120px; margin:auto; padding:38px 36px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:22px; border-bottom:1px solid var(--line); }
    .brand { font-size:20px; font-weight:700; letter-spacing:.05em; }
    .hint { color:var(--muted); font-size:14px; }
    h1 { margin:36px 0 8px; font-size:clamp(28px,4vw,44px); line-height:1.3; letter-spacing:-.04em; }
    .intro { margin:0 0 28px; color:var(--muted); }
    .activities { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px; }
    .activity { display:flex; flex-direction:column; color:inherit; text-decoration:none; background:var(--white); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .activity:hover { border-color:var(--green); }
    .activity:focus-visible { outline:3px solid var(--green); outline-offset:5px; }
    .drawing { width:100%; height:192px; background:var(--paper); border-bottom:1px solid var(--line); }
    .drawing .frame { fill:none; stroke:var(--ink); stroke-width:3; stroke-linejoin:round; }
    .drawing .brace { stroke:var(--green); stroke-width:4; }
    .drawing .joint { fill:var(--white); stroke:var(--ink); stroke-width:2; }
    .drawing .wire { fill:none; stroke:var(--copper); stroke-width:3; }
    .drawing .return { stroke:var(--green); }
    .drawing .led { fill:var(--white); stroke:var(--ink); stroke-width:2; }
    .copy { padding:24px; display:flex; flex-direction:column; flex:1; }
    .topic { color:var(--green); font-size:14px; font-weight:700; }
    h2 { margin:6px 0 10px; font-size:25px; line-height:1.4; }
    .description { color:var(--muted); margin:0 0 24px; }
    .action { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--green); font-weight:700; margin-top:auto; min-height:44px; border-top:1px solid var(--line); padding-top:16px; }
    footer { color:var(--muted); font-size:14px; margin-top:24px; }
    @media(max-width:650px) { main { padding:24px 20px; } header { align-items:flex-start; flex-direction:column; gap:4px; } .activities { grid-template-columns:1fr; } h1 { margin-top:28px; } }
  </style>
</head>
<body>
  <main>
    <header><span class="brand">STEAM 實驗室</span><span class="hint">觀察 · 操作 · 理解</span></header>
    <h1>揀一個主題，動手試。</h1>
    <p class="intro">搭橋試承重、推一推框架，或跟著接線步驟，睇清楚背後嘅原理。</p>
    <nav class="activities" aria-label="學習主題">
      <a class="activity" href="F3/wood-bridge.html" aria-labelledby="bridge-title bridge-action">
        <svg class="drawing" viewBox="0 0 480 192" aria-hidden="true">
          <path d="M30 136H450M60 136L105 58L150 136L195 58L240 136L285 58L330 136L375 58L420 136M105 58H375" fill="none" stroke="#ba8450" stroke-width="5" stroke-linejoin="round"/>
          <g class="joint"><circle cx="60" cy="136" r="5"/><circle cx="150" cy="136" r="5"/><circle cx="240" cy="136" r="5"/><circle cx="330" cy="136" r="5"/><circle cx="420" cy="136" r="5"/><circle cx="105" cy="58" r="5"/><circle cx="195" cy="58" r="5"/><circle cx="285" cy="58" r="5"/><circle cx="375" cy="58" r="5"/></g>
          <path d="M240 141V154" stroke="#16323b" stroke-width="2"/><rect x="225" y="154" width="30" height="23" rx="3" fill="#12695c"/>
        </svg>
        <div class="copy"><span class="topic">F3 · 木工結構與力</span><h2 id="bridge-title">木橋實驗室</h2><p class="description">用木桿連接搭橋，掛上重物，試吓邊種結構撐得住、邊條木桿最先斷。</p><span class="action" id="bridge-action">開始搭橋 <span aria-hidden="true">↗</span></span></div>
      </a>
      <a class="activity" href="F3/frame-bracing-standalone.html" aria-labelledby="frame-title frame-action">
        <svg class="drawing" viewBox="0 0 480 192" aria-hidden="true">
          <path class="frame" d="M62 146 H158 L130 50 H34 Z M288 146 H384 V50 H288 Z"/>
          <path class="brace" d="M288 146 L384 50 M288 50 L384 146"/>
          <g class="joint"><circle cx="62" cy="146" r="4"/><circle cx="158" cy="146" r="4"/><circle cx="130" cy="50" r="4"/><circle cx="34" cy="50" r="4"/><circle cx="288" cy="146" r="4"/><circle cx="384" cy="146" r="4"/><circle cx="384" cy="50" r="4"/><circle cx="288" cy="50" r="4"/></g>
        </svg>
        <div class="copy">
          <span class="topic">F3 · 木工結構與力</span>
          <h2 id="frame-title">框架斜撐模擬器</h2>
          <p class="description">改變左右剪力，比較無斜撐、一條對角斜撐，同兩條交叉斜撐嘅變形。</p>
          <span class="action" id="frame-action">開始模擬 <span aria-hidden="true">↗</span></span>
        </div>
      </a>
      <a class="activity" href="F2/led-matrix.html" aria-labelledby="led-title led-action">
        <svg class="drawing" viewBox="0 0 480 192" aria-hidden="true">
          <path class="wire" d="M128 154 V38 H352 M128 82 H352 M128 126 H352"/>
          <path class="wire return" d="M368 38 V154 H144 M368 66 H144 M368 110 H144"/>
          <path class="frame" d="M180 38 V66 M240 38 V66 M300 38 V66 M180 82 V110 M240 82 V110 M300 82 V110 M180 126 V154 M240 126 V154 M300 126 V154"/>
          <g class="led"><circle cx="180" cy="52" r="9"/><circle cx="240" cy="52" r="9"/><circle cx="300" cy="52" r="9"/><circle cx="180" cy="96" r="9"/><circle cx="240" cy="96" r="9"/><circle cx="300" cy="96" r="9"/><circle cx="180" cy="140" r="9"/><circle cx="240" cy="140" r="9"/><circle cx="300" cy="140" r="9"/></g>
        </svg>
        <div class="copy">
          <span class="topic">F2 · 電路與製作</span>
          <h2 id="led-title">LED 矩陣接線教學</h2>
          <p class="description">由 3 × 3 矩陣開始，逐步認識正負極、接線次序，同並聯電流嘅流向。</p>
          <span class="action" id="led-action">開始教學 <span aria-hidden="true">↗</span></span>
        </div>
      </a>
    </nav>
    <footer>用 iPad 操作時，橫放螢幕睇得更清楚。</footer>
  </main>
</body>
</html>
